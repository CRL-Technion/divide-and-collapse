[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapfc"
version = "0.0.1"
description = "Divide and Collapse: MAPF-Collapse via exact decomposition into independent sub-instances"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oren Salzman", email = "osalzman@cs.technion.ac.il" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]
viz = [
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python/mapfc"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "slow: long-running tests, excluded from default run",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The analysis scripts print wide, column-aligned report lines; breaking
# them across sources hurts readability more than the long line does.
"experiments/**" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/python/mapfc/io",
    "src/python/mapfc/single_agent",
    "src/python/mapfc/decompose",
]
# Grow this list as algorithm modules land:
#   src/python/mapfc/joint         (Phase 3)
