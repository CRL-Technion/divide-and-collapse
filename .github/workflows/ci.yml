name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly stress run at 04:00 UTC — gives the Hypothesis fuzzer the
    # higher-coverage ``stress-ci`` profile (500 examples) overnight.
    - cron: "0 4 * * *"

jobs:
  lint-test:
    name: lint + fast tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3

      # Install into a virtual environment rather than the interpreter on
      # PATH: the Ubuntu runners' system Python is externally managed
      # (PEP 668) and refuses installs, and `--system` would ignore the
      # matrix version even where it succeeds.
      - name: create environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: install project
        run: uv pip install -e ".[dev]"

      - name: put the environment on PATH (POSIX)
        if: runner.os != 'Windows'
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: put the environment on PATH (Windows)
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.venv\Scripts"

      # Guards the matrix: without this, a misconfigured install can test the
      # same interpreter in every cell while the job labels claim otherwise.
      - name: confirm the interpreter matches the matrix
        run: python -c "import sys; print(sys.version); assert sys.version.startswith('${{ matrix.python-version }}')"

      - name: ruff
        run: ruff check src tests examples

      - name: black
        run: black --check src tests examples

      - name: mypy
        run: mypy

      - name: pytest (not slow)
        run: pytest -m "not slow"

  stress:
    name: stress tests (PR + nightly)
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # Nightly uses the higher-coverage profile (500 examples); PRs
      # use the default ``stress-dev`` profile (50 examples) to keep
      # PR latency low.
      MAPFC_HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'stress-ci' || 'stress-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pytest -m slow
